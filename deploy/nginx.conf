# Nginx Reverse Proxy Configuration for SAILL on KVM 2 VPS
# Replace your-domain.com with your actual domain (e.g. saill.sritapps.in)

server {
    listen 80;
    server_name saill.sritapps.in; # Replace with your VPS domain or IP

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name saill.sritapps.in; # Replace with your VPS domain or IP

    # SSL Certificates (Managed by Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/saill.sritapps.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/saill.sritapps.in/privkey.pem;

    # Allow up to 25MB body size for Student Audio Submissions
    client_max_body_size 25M;

    # Gzip compression for high performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2;

    # Static assets caching
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Audio static files
    location /audio/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # All API & Web App Traffic
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
